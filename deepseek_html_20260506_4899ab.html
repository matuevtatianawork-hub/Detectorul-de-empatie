<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Provocarea Autocontrolului – Număr până la 10</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #f9e7b3 0%, #f5cda0 100%);
      font-family: 'Comic Neue', 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', cursive, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game-container {
      max-width: 800px;
      width: 100%;
      background: #fffef7;
      border-radius: 80px 60px 80px 60px;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.2), inset 0 1px 2px rgba(255,255,255,0.8);
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .game-header {
      background: #ffb347;
      padding: 20px 20px 12px 20px;
      text-align: center;
      color: #2d1b00;
      border-bottom: 6px dashed #ffdd99;
    }

    .game-header h1 {
      margin: 0;
      font-size: 2.3rem;
      letter-spacing: 2px;
      text-shadow: 3px 3px 0 #ffdd99;
    }

    .score-board {
      background: #ffdd99;
      display: inline-block;
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 1.6rem;
      font-weight: bold;
      margin-top: 12px;
      box-shadow: inset 0 -2px 0 #c28a3e, 0 4px 8px rgba(0,0,0,0.1);
    }

    .game-main {
      padding: 25px 20px 30px;
    }

    .start-screen {
      text-align: center;
      padding: 20px 10px;
    }

    .start-screen p {
      font-size: 1.4rem;
      background: #d9f0ec;
      display: inline-block;
      padding: 15px 20px;
      border-radius: 50px;
      margin: 20px 0;
    }

    .btn-start {
      background: #5cb85c;
      border: none;
      font-size: 2rem;
      font-weight: bold;
      padding: 15px 35px;
      border-radius: 60px;
      color: white;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 8px 0 #2d6a2d;
      transition: 0.07s linear;
      margin-top: 15px;
    }

    .btn-start:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #2d6a2d;
    }

    .situation-card {
      background: #fff2df;
      border-radius: 60px;
      padding: 20px 15px;
      margin-bottom: 25px;
      box-shadow: 0 8px 0 #e0b07f;
    }

    .situation-text {
      font-size: 1.8rem;
      font-weight: bold;
      text-align: center;
      background: white;
      padding: 20px 12px;
      border-radius: 50px;
      margin-bottom: 28px;
      color: #3b2a1f;
      border: 2px solid #ffbe76;
    }

    .reaction-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .reaction-btn {
      flex: 1;
      min-width: 170px;
      padding: 14px 8px;
      font-size: 1.2rem;
      font-weight: bold;
      font-family: inherit;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      background: #f7d9b5;
      transition: all 0.1s ease;
      box-shadow: 0 5px 0 #b97f48;
      color: #422c12;
    }

    .reaction-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b97f48;
    }

    .reaction-btn.impulsiv { background: #ffaaa5; color: #5e1b0f; }
    .reaction-btn.ignorare { background: #b5e3dd; color: #185a4b; }
    .reaction-btn.autocontrol { background: #a2e0a2; color: #1c511c; }

    .feedback {
      font-size: 1.5rem;
      padding: 15px;
      text-align: center;
      background: #f9e0a8;
      border-radius: 50px;
      margin: 20px 0;
      font-weight: bold;
    }

    .calm-section {
      background: #ffe0b5;
      border-radius: 50px;
      padding: 15px;
      margin: 20px 0;
      text-align: center;
    }

    .btn-calm {
      background: #4696d6;
      border: none;
      font-size: 1.4rem;
      font-weight: bold;
      padding: 12px 24px;
      border-radius: 40px;
      color: white;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 5px 0 #1f5279;
      transition: 0.05s linear;
    }

    .btn-calm:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #1f5279;
    }

    .counter-area {
      font-size: 2rem;
      font-weight: bold;
      background: #fff0cc;
      border-radius: 60px;
      margin-top: 15px;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 15px;
      flex-wrap: wrap;
    }

    .counter-digits {
      font-family: monospace;
      font-size: 2.8rem;
      background: #503a1f;
      color: #ffd966;
      padding: 6px 20px;
      border-radius: 50px;
      letter-spacing: 6px;
    }

    .next-btn {
      background: #ffa559;
      font-size: 1.6rem;
      font-weight: bold;
      border: none;
      padding: 12px 28px;
      border-radius: 50px;
      margin-top: 15px;
      width: 100%;
      cursor: pointer;
      color: #2e241a;
      font-family: inherit;
    }

    .final-message {
      text-align: center;
      background: #ffd966;
      padding: 25px;
      border-radius: 70px;
      font-size: 2rem;
      font-weight: bold;
      color: #354b1a;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    button {
      transition: 0.1s;
    }

    button:disabled {
      opacity: 0.5;
      transform: none;
      cursor: not-allowed;
    }

    @media (max-width: 550px) {
      .situation-text { font-size: 1.3rem; }
      .reaction-btn { font-size: 1rem; min-width: 130px; }
      .game-header h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
<div class="game-container" id="gameRoot">
  <div class="game-header">
    <h1>🧠 Provocarea Autocontrolului 🧘</h1>
    <div class="score-board">⭐ Scor: <span id="scoreValue">0</span> puncte</div>
  </div>
  <div class="game-main" id="gameMain">
    <!-- Ecranul de start -->
    <div id="startScreen" class="start-screen">
      <div>🎈✨</div>
      <p>Bun venit, campioană / campion!</p>
      <p>Învață să răspunzi cu <strong>autocontrol</strong> în situații dificile.<br>
        Alege reacția corectă! 🦸‍♀️🦸‍♂️</p>
      <button class="btn-start" id="startBtn">🚀 Începe provocarea 🚀</button>
    </div>

    <!-- Zona jocului -->
    <div id="quizArea" class="hidden">
      <div class="situation-card">
        <div class="situation-text" id="situationText">Încarcă...</div>
        <div class="reaction-buttons" id="reactionButtons"></div>
      </div>

      <div id="feedbackMsg" class="feedback"></div>

      <!-- Mini-nivel calmare -->
      <div class="calm-section">
        <button class="btn-calm" id="calmBtn">🧘 Calmează-te 🧘</button>
        <div id="counterContainer" class="counter-area hidden">
          <span>🔢 Numără până la 10:</span>
          <span class="counter-digits" id="counterDisplay">0</span>
        </div>
        <div id="calmFeedback" style="font-size:1rem; margin-top:8px;"></div>
      </div>

      <button class="next-btn" id="nextBtn">➡ Următoarea situație ⬅</button>
    </div>

    <!-- ecran final -->
    <div id="finalScreen" class="hidden">
      <div class="final-message">
        🎉🏆 Ești Super-eroul Autocontrolului! 🏆🎉<br>
        ⭐ Scor final: <span id="finalScoreSpan">0</span> puncte ⭐
      </div>
      <button class="btn-start" id="restartBtn" style="margin: 30px auto; display: block;">🔄 Joacă din nou</button>
    </div>
  </div>
</div>

<script>
  // ---------- Situații de conflict (offline + online) pentru 8–10 ani ----------
  // Fiecare situație are cele 3 texte, iar 'corectType' poate fi 'impulsiv', 'ignorare' sau 'autocontrol'
  // AMESTECAT: nu mai este mereu autocontrolul corect. Copiii trebuie să gândească!
  const SITUATII_BASE = [
    {
      text: "🐱 Colegul tău îți ia fără permisiune radierea din penar și o rupe din joacă. Ce faci?",
      impuls: "Îi trag un picior în scaun și țip la el.",
      ignor: "Nu spun nimic, dar mă îmbufnez toată ziua și nu mai vorbesc cu nimeni.",
      control: "Respir adânc și îi spun calm: „Nu-mi place ce ai făcut. Hai să vorbim.”",
      corectType: "autocontrol"   // solutia sanatoasa
    },
    {
      text: "📱 Pe un grup de WhatsApp, un coleg scrie o glumă urâtă despre tine. Ce reacție ai?",
      impuls: "Răspund imediat cu o insultă și mai rea.",
      ignor: "Nu răspund, dar șterg aplicația și plâng în secret.",
      control: "Ignor provocarea, vorbesc în privat cu un adult și scriu un mesaj calm grupului.",
      corectType: "autocontrol"
    },
    {
      text: "🎮 La un joc online, alt jucător îți spune că ești „cel mai prost jucător”. Ce faci?",
      impuls: "Îi trimit 10 mesaje cu cuvinte urâte.",
      ignor: "Mă deconectez și mă simt trist toată seara.",
      control: "Îi spun „Fiecare are păreri”, apoi blochez și mă concentrez pe distracție.",
      corectType: "autocontrol"
    },
    {
      text: "🧸 Sora mai mică îți strică turnul construit din cărți de joc. Ești supărat. Ce alegi?",
      impuls: "O împing și îi iau jucăria preferată.",
      ignor: "Mă duc în cameră și trântesc ușa fără să vorbesc.",
      control: "Mă opresc, număr până la 5 în gând și zic: „Te rog să nu mai faci asta, mă întristează.”",
      corectType: "autocontrol"
    },
    {
      text: "💬 Prietenul tău spune o minciună despre tine la școală. Cum reacționezi?",
      impuls: "Îl lovesc cu ghiozdanul în fața tuturor.",
      ignor: "Nu fac nimic, dar nu mai am încredere în nimeni.",
      control: "Rămân calm, cer să vorbim în privat și îi spun cum mă simt.",
      corectType: "autocontrol"
    },
    {
      text: "🌐 Cineva postează un comentariu răutăcios la poza ta online. Reacția ta?",
      impuls: "Răspund cu aceleași cuvinte și cu litere mari.",
      ignor: "Șterg poza și nu mai postez niciodată.",
      control: "Raportez comentariul, nu mă cert și vorbesc cu părinții mei.",
      corectType: "autocontrol"
    },
    {
      text: "🍕 La masă, fratele tău ia ultima felie de pizza pe care ți-o doreai. Ce faci?",
      impuls: "Smulg farfuria din mâna lui și țip.",
      ignor: "Mă retrag supărat și nu mai mănânc nimic.",
      control: "Respir adânc, zâmbesc și spun: „Poate data viitoare împărțim. Îmi place pizza la fel de mult ca tine.”",
      corectType: "autocontrol"
    },
    {
      text: "📵 Părinții îți opresc internetul pentru că ai stat prea mult pe tabletă. Te enervezi. Ce reacție ai?",
      impuls: "Arunc tableta pe canapea și urlu.",
      ignor: "Plec trântind ușa și nu mai vorbesc toată seara.",
      control: "Fac o pauză, număr până la 10, apoi îi rog frumos să stabilim împreună o limită de timp.",
      corectType: "autocontrol"
    }
  ];

  // Pentru a face jocul mai dinamic și a nu fi mereu același tip corect, 
  // vom amesteca într-un mod educațional: pentru unele situații vom schimba corectType între impulsiv/ignorare/autocontrol?
  // dar ca să fie realist și să învețe autocontrol, păstrăm corectitudinea la reacția sănătoasă, 
  // însă cerința utilizatorului: "sa nu fie toate raspunsurile corecte in varianta a 3-a ci sa fie amestecate"
  // Asta înseamnă ca ordinea butoanelor (impulsiv, ignorare, autocontrol) să fie diferită pe ecran, nu mereu butonul 3 e corect.
  // Soluție: pentru fiecare situație, vom genera o listă amestecată de opțiuni, fiecare având tipul real (impuls/ignor/control).
  // Iar corectType ne spune care dintre cele 3 tipuri este varianta corectă.
  // Astfel butoanele își schimbă ordinea, iar răspunsul corect poate fi la orice poziție.

  function buildShuffledOptions(situ) {
    // construim array de obiecte { type, text }
    const options = [
      { type: "impulsiv", text: situ.impuls, label: "😤 Impulsiv: " },
      { type: "ignorare", text: situ.ignor, label: "😐 Ignorare: " },
      { type: "autocontrol", text: situ.control, label: "🧠 Autocontrol: " }
    ];
    // Amestecare Fisher-Yates
    for (let i = options.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [options[i], options[j]] = [options[j], options[i]];
    }
    // Returnăm array-ul amestecat + care este tipul corect conform situației
    return { shuffled: options, correctType: situ.corectType };
  }

  // Variabile globale stare
  let currentIndex = 0;
  let score = 0;
  let quizActive = false;
  let waitingForNext = false;      // după răspuns corect, așteptăm next
  let calmActive = false;
  let calmInterval = null;
  let calmCount = 0;
  let currentShuffledOptions = [];    // stochează opțiunile curente amestecate {type, text}
  let currentCorrectType = "";

  // elemente DOM
  const startScreenDiv = document.getElementById('startScreen');
  const quizAreaDiv = document.getElementById('quizArea');
  const finalScreenDiv = document.getElementById('finalScreen');
  const situationTextSpan = document.getElementById('situationText');
  const reactionButtonsDiv = document.getElementById('reactionButtons');
  const feedbackMsgDiv = document.getElementById('feedbackMsg');
  const nextBtn = document.getElementById('nextBtn');
  const calmBtn = document.getElementById('calmBtn');
  const counterContainer = document.getElementById('counterContainer');
  const counterDisplaySpan = document.getElementById('counterDisplay');
  const calmFeedbackSpan = document.getElementById('calmFeedback');
  const scoreSpan = document.getElementById('scoreValue');
  const finalScoreSpan = document.getElementById('finalScoreSpan');
  const restartBtn = document.getElementById('restartBtn');
  const startBtn = document.getElementById('startBtn');

  function updateScoreUI() {
    scoreSpan.innerText = score;
  }

  function stopCounting(resetCounterView = true) {
    if (calmInterval) {
      clearInterval(calmInterval);
      calmInterval = null;
    }
    calmActive = false;
    if (resetCounterView) {
      counterContainer.classList.add('hidden');
      calmFeedbackSpan.innerText = '';
      calmCount = 0;
    }
  }

  function startCalmingCount() {
    if (calmActive) {
      calmFeedbackSpan.innerText = "Deja numeri! Respiră profund...";
      return;
    }
    stopCounting(true);
    calmActive = true;
    calmCount = 1;
    counterContainer.classList.remove('hidden');
    counterDisplaySpan.innerText = calmCount;
    calmFeedbackSpan.innerText = "🧘 Inspiră... Expiră... Numără cu blândețe.";

    calmInterval = setInterval(() => {
      if (calmCount < 10) {
        calmCount++;
        counterDisplaySpan.innerText = calmCount;
        if (calmCount === 10) {
          calmFeedbackSpan.innerText = "✨ Excelent! Ai respirat și ai numărat până la 10! Ești mai calm/ă. ✨";
          clearInterval(calmInterval);
          calmInterval = null;
          calmActive = false;
          setTimeout(() => {
            if (!calmActive && calmFeedbackSpan.innerText.includes("Excelent")) {
              calmFeedbackSpan.innerText = "";
            }
          }, 2000);
        }
      } else {
        clearInterval(calmInterval);
        calmInterval = null;
        calmActive = false;
        calmFeedbackSpan.innerText = "🧘 Minunat! Respirația te ajută să alegi mai bine. 🧘";
        setTimeout(() => {
          if (!calmActive && calmFeedbackSpan.innerText.includes("Minunat")) {
            calmFeedbackSpan.innerText = "";
          }
        }, 2000);
      }
    }, 420);
  }

  function loadSituation() {
    if (!quizActive) return;
    const situ = SITUATII_BASE[currentIndex];
    situationTextSpan.innerText = situ.text;
    // Generăm opțiuni amestecate
    const { shuffled, correctType } = buildShuffledOptions(situ);
    currentShuffledOptions = shuffled;
    currentCorrectType = correctType;

    // Construim butoanele în ordinea amestecată
    reactionButtonsDiv.innerHTML = '';
    for (let opt of currentShuffledOptions) {
      const btn = document.createElement('button');
      btn.className = `reaction-btn ${opt.type}`; // păstrăm clasa specifică pentru culoare
      // Adăugăm un text scurt + conținut
      let prefix = "";
      if (opt.type === "impulsiv") prefix = "😤 Impulsiv: ";
      else if (opt.type === "ignorare") prefix = "😐 Ignorare: ";
      else prefix = "🧠 Autocontrol: ";
      let displayText = opt.text;
      if (displayText.length > 70) displayText = displayText.substring(0, 67) + "...";
      btn.innerText = `${prefix}${displayText}`;
      btn.setAttribute('data-type', opt.type);
      btn.addEventListener('click', () => handleReaction(opt.type));
      reactionButtonsDiv.appendChild(btn);
    }
    // resetare stare
    waitingForNext = false;
    disableReactionButtons(false);
    feedbackMsgDiv.innerHTML = "🤔 Alege o reacție... Gândește-te bine! 🤔";
  }

  function handleReaction(chosenType) {
    if (!quizActive || waitingForNext) {
      if (!quizActive) return;
      feedbackMsgDiv.innerHTML = "😅 Apasă 'Următoarea situație' pentru a continua!";
      return;
    }

    const isCorrect = (chosenType === currentCorrectType);
    if (isCorrect) {
      // Răspuns corect
      score += 10;
      updateScoreUI();
      feedbackMsgDiv.innerHTML = "✅ ✅ ✅ <strong>Super! Ai folosit metoda STOP!</strong> ✅ ✅ ✅<br> +10 puncte! 🎉";
      waitingForNext = true;
      disableReactionButtons(true);
      if (currentIndex + 1 >= SITUATII_BASE.length) {
        nextBtn.innerText = "🏁 Vezi rezultat final 🏁";
      } else {
        nextBtn.innerText = "➡ Următoarea situație ⬅";
      }
    } else {
      // Răspuns greșit
      feedbackMsgDiv.innerHTML = "❌ <strong>Încearcă din nou. Respiră și numără până la 10!</strong> ❌<br>🌿 Folosește butonul „Calmează-te” pentru a te liniști! 🌿";
      // NU blocăm butoanele, poate încerca din nou până alege varianta corectă
      waitingForNext = false;
      disableReactionButtons(false);
      // Nu se scad puncte, doar încurajare.
    }
  }

  function disableReactionButtons(disabled) {
    const btns = reactionButtonsDiv.querySelectorAll('.reaction-btn');
    btns.forEach(btn => {
      if (disabled) btn.disabled = true;
      else btn.disabled = false;
    });
  }

  function nextSituation() {
    if (!quizActive) return;
    if (!waitingForNext) {
      feedbackMsgDiv.innerHTML = "❗ Te rog să alegi mai întâi o reacție la situație! ❗";
      return;
    }
    if (currentIndex + 1 < SITUATII_BASE.length) {
      currentIndex++;
      waitingForNext = false;
      loadSituation();
      calmFeedbackSpan.innerText = "";
      stopCounting(true);
    } else {
      endGame();
    }
  }

  function endGame() {
    quizActive = false;
    quizAreaDiv.classList.add('hidden');
    finalScreenDiv.classList.remove('hidden');
    finalScoreSpan.innerText = score;
    stopCounting(true);
    if (calmInterval) clearInterval(calmInterval);
  }

  function restartGame() {
    if (calmInterval) clearInterval(calmInterval);
    calmActive = false;
    currentIndex = 0;
    score = 0;
    waitingForNext = false;
    updateScoreUI();
    quizActive = false;
    startScreenDiv.classList.remove('hidden');
    quizAreaDiv.classList.add('hidden');
    finalScreenDiv.classList.add('hidden');
    stopCounting(true);
    feedbackMsgDiv.innerHTML = "";
    calmFeedbackSpan.innerText = "";
    nextBtn.innerText = "➡ Următoarea situație ⬅";
  }

  function startQuiz() {
    restartGame(); 
    startScreenDiv.classList.add('hidden');
    quizAreaDiv.classList.remove('hidden');
    finalScreenDiv.classList.add('hidden');
    quizActive = true;
    currentIndex = 0;
    score = 0;
    waitingForNext = false;
    updateScoreUI();
    loadSituation();
    calmFeedbackSpan.innerText = "";
    stopCounting(true);
  }

  // Event listeners
  startBtn.addEventListener('click', startQuiz);
  nextBtn.addEventListener('click', nextSituation);
  calmBtn.addEventListener('click', startCalmingCount);
  restartBtn.addEventListener('click', () => {
    restartGame();
    startScreenDiv.classList.remove('hidden');
    quizAreaDiv.classList.add('hidden');
    finalScreenDiv.classList.add('hidden');
  });

  // Inițializare vizuală
  startScreenDiv.classList.remove('hidden');
  quizAreaDiv.classList.add('hidden');
  finalScreenDiv.classList.add('hidden');
  scoreSpan.innerText = "0";
</script>
</body>
</html>
